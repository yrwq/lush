[package]
name = "lush"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "lush"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
gtk4-layer-shell = "0.4"
glib = "0.20"
gio = "0.20"
gdk-pixbuf = "0.20"

mlua = { version = "0.10", features = ["lua54", "vendored"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

chrono = "0.4"
once_cell = "1"
log = "0.4"
env_logger = "0.11"
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"
async-channel = "2"
clap = { version = "4.5.59", features = ["derive"] }
procfs = "0.17"
libc = "0.2"
zbus = { version = "4", features = ["blocking"] }
udev = "0.9"
libpulse-binding = "2.29"

[profile.release]
opt-level = 3
lto = true
strip = true
